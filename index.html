<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>我的静态Wiki</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.6.0/styles/github.min.css">
</head>
<body>

        <h1>我的知识库</h1>

    <!-- 本地脚本 -->
    <script src="js/main.js"></script>
